name: Test Wiki Sync

on:
  push:
    branches:
      - feat/sync-wiki-documentation

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Wiki to lp-forge-sdd
        env:
          WIKI_PAT: ${{ secrets.LP_FORGE_SDD_TOKEN }}
        run: |
          if [ -z "$WIKI_PAT" ]; then
            echo "Error: LP_FORGE_SDD_TOKEN is not set."
            exit 1
          fi
          
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BRANCH_NAME="docs/test-sync-${COMMIT_SHA}"
          
          echo "Cloning lp-forge-sdd..."
          git clone "https://x-access-token:${WIKI_PAT}@github.com/nathanramorim/lp-forge-sdd.git" lp-repo
          
          cd lp-repo
          git checkout -b "${BRANCH_NAME}"
          
          echo "Creating wiki/content directory in target repo if it does not exist..."
          mkdir -p wiki/content
          
          echo "Copying documentation..."
          cp ../docs/introducao.md wiki/content/
          cp ../docs/comandos.md wiki/content/
          cp ../docs/skills.md wiki/content/
          cp ../sdd/releases/history.md wiki/content/releases.md
          
          echo "Updating structure.json..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const wikiDir = 'wiki';
            const contentDir = path.join(wikiDir, 'content');
            const structPath = path.join(wikiDir, 'structure.json');
            if (fs.existsSync(structPath)) {
              const struct = JSON.parse(fs.readFileSync(structPath, 'utf8'));
              struct.pages = struct.pages || [];
              let updated = false;
              if (!struct.pages.some(p => p.file === 'releases.md')) {
                struct.pages.push({
                  id: 'releases',
                  title: 'Histórico de Releases',
                  file: 'releases.md'
                });
                updated = true;
                console.log('Added releases.md to structure.json');
              }
              const files = fs.readdirSync(contentDir).filter(f => f.endsWith('.md') && f !== 'HOME.md');
              for (const file of files) {
                if (!struct.pages.some(p => p.file === file)) {
                  const content = fs.readFileSync(path.join(contentDir, file), 'utf8');
                  const match = content.match(/^#\s+(.+)$/m);
                  const title = match ? match[1].trim() : path.basename(file, '.md').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                  const id = path.basename(file, '.md');
                  struct.pages.push({ id, title, file });
                  updated = true;
                  console.log('Added ' + file + ' as \"' + title + '\" to structure.json');
                }
              }
              if (updated) {
                fs.writeFileSync(structPath, JSON.stringify(struct, null, 2) + '\n');
              }
            } else {
              console.log('structure.json not found, skipping update');
            }
          "
          
          echo "Configuring git user..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wiki/
          
          if git diff --staged --quiet; then
            echo "No changes in wiki, skipping commit."
          else
            git commit -m "docs: test sync wiki from branch ${GITHUB_REF_NAME}"
            git push origin "${BRANCH_NAME}"
            
            echo "Creating Pull Request on lp-forge-sdd via REST API..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${WIKI_PAT}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/nathanramorim/lp-forge-sdd/pulls \
              -d "{\"title\":\"docs: test sync wiki from branch ${GITHUB_REF_NAME}\",\"body\":\"Automated documentation sync test from forge-sdd branch ${GITHUB_REF_NAME}.\",\"head\":\"${BRANCH_NAME}\",\"base\":\"main\"}")
            
            if [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 422 ]; then
              echo "Pull Request created successfully or already exists (HTTP $RESPONSE)."
            else
              echo "Failed to create Pull Request (HTTP $RESPONSE)."
              exit 1
            fi
          fi
