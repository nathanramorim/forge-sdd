name: CI

# Política de CI do Forge-SDD (fix-106-10, ADR-0022): local primeiro.
#
# - O trabalho é conferido na máquina: `scripts/ci-local.sh` roda os mesmos passos
#   deste workflow e grava o selo `.forge/runtime/ci-local.json` com o HEAD.
# - O GitHub Actions roda **uma vez**, quando o PR é liberado para o CI
#   (`ready_for_review`), ou à mão (`workflow_dispatch`). Push em draft, em PR
#   pronto e na `main` não cria run. Nova rodada: voltar a draft e marcar pronto.
# - `concurrency` cancela a execução anterior do mesmo PR.
# - O evento de PR é sempre `pull_request` (o código do PR nunca roda com os
#   segredos do repositório).

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

concurrency:
  # Agrupa por PR; o disparo manual agrupa pela ref.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Recusa PR em draft (rede de segurança para o workflow_dispatch). Não é check
  # obrigatório: a proteção da main não exige checks (required_status_checks vazio).
  pronto:
    name: pronto?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR não pode estar em draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          draft=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
          if [ "$draft" = "true" ]; then
            echo "::error::O PR #$PR está em draft. Marque como pronto só depois da conferência do Reviewer."
            exit 1
          fi
          echo "PR #$PR pronto para revisão."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Passos do CI (scripts/ci-local.sh)
        run: scripts/ci-local.sh test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest