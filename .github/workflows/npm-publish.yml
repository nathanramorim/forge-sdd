name: Publish npm

on:
  push:
    tags:
      - 'v*'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync package version with tag
        working-directory: npm
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$TAG"

      - name: Resolve npm dist-tag
        id: npm-tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" == *"-"* ]]; then
            echo "NPM_TAG=beta" >> "$GITHUB_OUTPUT"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public --tag ${{ steps.npm-tag.outputs.NPM_TAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify dist-tag published
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NPM_TAG="${{ steps.npm-tag.outputs.NPM_TAG }}"
          for i in $(seq 1 6); do
            PUBLISHED=$(npm view @nathanramorim/forge-sdd dist-tags."$NPM_TAG" 2>/dev/null || echo "")
            if [ "$PUBLISHED" = "$TAG" ]; then
              echo "dist-tag $NPM_TAG confirmado em $TAG"
              exit 0
            fi
            sleep 20
          done
          echo "::error::dist-tag $NPM_TAG aponta para '$PUBLISHED', esperado '$TAG'"
          exit 1
