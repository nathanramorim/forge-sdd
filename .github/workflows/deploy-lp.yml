name: Deploy LP

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/wrangler.jsonc'
      - '.github/workflows/deploy-lp.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A seção de novidades da LP lê docs/data/releases.json. Regerar aqui
      # garante que o site nunca suba com o arquivo atrasado em relação ao
      # sdd/releases/history.md (feat-112-03).
      - name: Regerar as novidades da LP
        run: python3 scripts/novidades_lp.py

      - name: Falhar se o JSON divergir do histórico
        run: python3 scripts/novidades_lp.py --check

      - name: Deploy Worker (LP)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: site
          # O padrão da action (3.90) não lê wrangler.jsonc e falha com "Missing entry-point".
          wranglerVersion: "4.165.0"
