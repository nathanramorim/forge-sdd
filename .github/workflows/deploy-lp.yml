name: Deploy LP

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/wrangler.jsonc'
      - '.github/workflows/deploy-lp.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker (LP)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: site
          # O padrão da action (3.90) não lê wrangler.jsonc e falha com "Missing entry-point".
          wranglerVersion: "4.165.0"
