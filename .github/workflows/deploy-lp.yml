name: Deploy LP

# Só manual (fix-106-11): o deploy normal é local, com scripts/lp-deploy.sh.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Regera, confere o JSON e publica: tudo no script, um lugar só (DUP-01).
      - name: Publicar a LP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Variável do repositório (não é segredo): o id da conta que recebe a LP.
          LP_CLOUDFLARE_ACCOUNT_ID: ${{ vars.LP_CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/lp-deploy.sh
