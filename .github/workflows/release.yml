name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract Release Notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          CLEAN_TAG="${TAG_NAME#v}"
          VERSION_BASE=$(echo "${CLEAN_TAG}" | cut -d'-' -f1)
          
          echo "Extracting release notes for Version ${VERSION_BASE} from sdd/releases/history.md..."
          node -e '
            const fs = require("fs");
            const versionBase = process.argv[1];
            const content = fs.readFileSync("sdd/releases/history.md", "utf8");
            const regex = new RegExp(`###\\s+Versão\\s+${versionBase}[\\s\\S]*?(?=\\n###|\\n##|$)`, "i");
            const match = content.match(regex);
            let notes = "";
            if (match) {
              notes = match[0].trim();
            } else {
              notes = `Release notes para a versão ${process.env.GITHUB_REF_NAME}. Veja sdd/releases/history.md para detalhes.`;
            }
            fs.writeFileSync("/tmp/RELEASE_NOTES.md", notes + "\n");
          ' "${VERSION_BASE}"
          
          echo "Release notes written to /tmp/RELEASE_NOTES.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=/tmp/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Wiki to lp-forge-sdd
        env:
          WIKI_PAT: ${{ secrets.LP_FORGE_SDD_TOKEN }}
        run: |
          if [ -z "$WIKI_PAT" ]; then
            echo "Warning: LP_FORGE_SDD_TOKEN is not set. Skipping wiki sync."
            exit 0
          fi
          
          TAG_NAME="${GITHUB_REF_NAME}"
          BRANCH_NAME="docs/sync-${TAG_NAME}"
          
          echo "Cloning lp-forge-sdd..."
          git clone "https://x-access-token:${WIKI_PAT}@github.com/nathanramorim/lp-forge-sdd.git" lp-repo
          
          cd lp-repo
          git checkout -b "${BRANCH_NAME}"
          
          echo "Creating wiki/content directory in target repo if it does not exist..."
          mkdir -p wiki/content
          
          echo "Copying documentation..."
          cp ../docs/introducao.md wiki/content/
          cp ../docs/comandos.md wiki/content/
          cp ../docs/skills.md wiki/content/
          cp ../docs/telemetria.md wiki/content/
          cp ../docs/arquitetura-e-fluxo-forge-sdd.md wiki/content/
          cp ../sdd/releases/history.md wiki/content/releases.md
          
          echo "Updating structure.json..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const wikiDir = 'wiki';
            const contentDir = path.join(wikiDir, 'content');
            const structPath = path.join(wikiDir, 'structure.json');
            if (fs.existsSync(structPath)) {
              const struct = JSON.parse(fs.readFileSync(structPath, 'utf8'));
              struct.pages = struct.pages || [];
              let updated = false;
              if (!struct.pages.some(p => p.file === 'releases.md')) {
                struct.pages.push({
                  id: 'releases',
                  title: 'Histórico de Releases',
                  file: 'releases.md'
                });
                updated = true;
                console.log('Added releases.md to structure.json');
              }
              const files = fs.readdirSync(contentDir).filter(f => f.endsWith('.md') && f !== 'HOME.md');
              for (const file of files) {
                if (!struct.pages.some(p => p.file === file)) {
                  const content = fs.readFileSync(path.join(contentDir, file), 'utf8');
                  const match = content.match(/^#\s+(.+)$/m);
                  const title = match ? match[1].trim() : path.basename(file, '.md').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                  const id = path.basename(file, '.md');
                  struct.pages.push({ id, title, file });
                  updated = true;
                  console.log('Added ' + file + ' as \"' + title + '\" to structure.json');
                }
              }
              if (updated) {
                fs.writeFileSync(structPath, JSON.stringify(struct, null, 2) + '\n');
              }
            } else {
              console.log('structure.json not found, skipping update');
            }
          "
          
          echo "Configuring git user..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wiki/
          
          if git diff --staged --quiet; then
            echo "No changes in wiki, skipping commit."
          else
            git commit -m "docs: sync wiki from forge-sdd tag ${TAG_NAME}"
            git push origin "${BRANCH_NAME}" --force
            
            echo "Creating Pull Request on lp-forge-sdd via REST API..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${WIKI_PAT}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/nathanramorim/lp-forge-sdd/pulls \
              -d "{\"title\":\"docs: sync wiki from forge-sdd ${TAG_NAME}\",\"body\":\"Automated documentation sync from forge-sdd tag ${TAG_NAME}.\",\"head\":\"${BRANCH_NAME}\",\"base\":\"main\"}")
            
            if [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 422 ]; then
              echo "Pull Request created successfully or already exists (HTTP $RESPONSE)."
            else
              echo "Failed to create Pull Request (HTTP $RESPONSE)."
              exit 1
            fi
          fi
