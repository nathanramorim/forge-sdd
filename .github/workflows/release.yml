name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract Release Notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          CLEAN_TAG="${TAG_NAME#v}"
          VERSION_BASE=$(echo "${CLEAN_TAG}" | cut -d'-' -f1)
          
          echo "Extracting release notes for Version ${VERSION_BASE} from sdd/releases/history.md..."
          node -e '
            const fs = require("fs");
            const versionBase = process.argv[1];
            const content = fs.readFileSync("sdd/releases/history.md", "utf8");
            const regex = new RegExp(`###\\s+Versão\\s+${versionBase}[\\s\\S]*?(?=\\n###|\\n##|$)`, "i");
            const match = content.match(regex);
            let notes = "";
            if (match) {
              notes = match[0].trim();
            } else {
              notes = `Release notes para a versão ${process.env.GITHUB_REF_NAME}. Veja sdd/releases/history.md para detalhes.`;
            }
            fs.writeFileSync("/tmp/RELEASE_NOTES.md", notes + "\n");
          ' "${VERSION_BASE}"
          
          echo "Release notes written to /tmp/RELEASE_NOTES.md"

      - name: Enforce Beta Release Highlights
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if echo "${TAG_NAME}" | grep -qE -- '-(beta|rc|alpha)'; then
            if grep -q "Release notes para a versão" /tmp/RELEASE_NOTES.md; then
              echo "::error::A tag ${TAG_NAME} é uma pre-release e não tem uma seção com destaques reais em sdd/releases/history.md (caiu no texto genérico de fallback). Adicione uma entrada '### Versão <versão> (Beta)' com bullets descrevendo o que foi melhorado antes de publicar."
              exit 1
            fi
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=/tmp/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce Release Retention Policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const { execSync } = require("child_process");
            const repo = process.env.GITHUB_REPOSITORY;
            const releases = JSON.parse(execSync(`gh api repos/${repo}/releases --paginate`).toString());

            const isBeta = r => r.prerelease || /-(beta|rc|alpha)(\.|$)/i.test(r.tag_name);

            const drafts = releases.filter(r => r.draft);
            const published = releases.filter(r => !r.draft);
            published.sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            // Mantém as 3 releases estáveis mais recentes, mais qualquer
            // pre-release publicada depois da mais antiga dessas 3 (betas
            // ativas à frente da última estável retida). Usa o nome da tag
            // além do campo `prerelease` da API pois releases antigas (antes
            // de `prerelease: auto` no goreleaser) não têm o campo setado.
            const stables = published.filter(r => !isBeta(r));
            const keepStables = stables.slice(0, 3);
            const cutoff = keepStables.length
              ? new Date(keepStables[keepStables.length - 1].published_at)
              : new Date(0);

            const keepIds = new Set(keepStables.map(r => r.id));
            for (const r of published) {
              if (isBeta(r) && new Date(r.published_at) > cutoff) keepIds.add(r.id);
            }
            const keptTagNames = new Set(published.filter(r => keepIds.has(r.id)).map(r => r.tag_name));

            const toDelete = [...drafts, ...published.filter(r => !keepIds.has(r.id))];
            for (const r of toDelete) {
              console.log(`Deleting release id=${r.id} tag=${r.tag_name} draft=${r.draft}`);
              try {
                execSync(`gh api -X DELETE repos/${repo}/releases/${r.id}`, { stdio: "inherit" });
              } catch (e) {
                console.log(`Release id=${r.id} não removida (seguindo para as próximas): ${e.message}`);
                continue;
              }
              if (!keptTagNames.has(r.tag_name)) {
                try {
                  execSync(`git push origin :refs/tags/${r.tag_name}`, { stdio: "inherit" });
                } catch (e) {
                  console.log(`Tag ${r.tag_name} não removida (provavelmente já ausente): ${e.message}`);
                }
              }
            }
            if (!toDelete.length) console.log("Nada para podar — política de retenção já satisfeita.");
          '

      # A LP mostra as novidades lendo docs/data/releases.json. Depois de
      # publicar a tag, o JSON é regerado a partir do history.md e enviado
      # num PR de uma branch própria (feat-112-03): a `main` exige revisão,
      # então push direto seria rejeitado. `[skip ci]` evita rodar CI pelo
      # artefato gerado.
      - name: Regerar as novidades da LP e abrir PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH_NAME="chore/lp-novidades-${GITHUB_REF_NAME}"

          git config user.name "forge-sdd release"
          git config user.email "release@forge-sdd.org"

          python3 scripts/novidades_lp.py
          if git diff --quiet -- origin/main -- docs/data/releases.json 2>/dev/null; then
            echo "Novidades já em dia; nada a commitar."
            exit 0
          fi

          git fetch origin main
          git checkout -B "${BRANCH_NAME}" origin/main
          # Regera sobre a base já atualizada, para o diff conter só o JSON.
          python3 scripts/novidades_lp.py
          if git diff --quiet -- docs/data/releases.json; then
            echo "Novidades já em dia na main; nada a commitar."
            exit 0
          fi

          git add docs/data/releases.json
          git commit -m "docs(lp): regera as novidades da ${GITHUB_REF_NAME} [skip ci]"
          git push origin "${BRANCH_NAME}"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            -d "{\"title\":\"docs(lp): novidades da ${GITHUB_REF_NAME}\",\"body\":\"Regerado por scripts/novidades_lp.py a partir de sdd/releases/history.md na tag ${GITHUB_REF_NAME}. Artefato gerado; basta aprovar.\",\"head\":\"${BRANCH_NAME}\",\"base\":\"main\"}")

          if [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 422 ]; then
            echo "PR das novidades criado ou já existente (HTTP $RESPONSE)."
          else
            echo "Falha ao criar o PR das novidades (HTTP $RESPONSE)."
            exit 1
          fi
