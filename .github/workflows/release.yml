name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Wiki to lp-forge-sdd
        env:
          WIKI_PAT: ${{ secrets.LP_FORGE_SDD_TOKEN }}
        run: |
          if [ -z "$WIKI_PAT" ]; then
            echo "Warning: LP_FORGE_SDD_TOKEN is not set. Skipping wiki sync."
            exit 0
          fi
          
          TAG_NAME="${GITHUB_REF_NAME}"
          BRANCH_NAME="docs/sync-${TAG_NAME}"
          
          echo "Cloning lp-forge-sdd..."
          git clone "https://x-access-token:${WIKI_PAT}@github.com/nathanramorim/lp-forge-sdd.git" lp-repo
          
          cd lp-repo
          git checkout -b "${BRANCH_NAME}"
          
          echo "Creating wiki directory in target repo if it does not exist..."
          mkdir -p wiki
          
          echo "Copying documentation..."
          cp -r ../docs/* wiki/
          cp ../README.md wiki/HOME.md
          
          echo "Configuring git user..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wiki/
          
          if git diff --staged --quiet; then
            echo "No changes in wiki, skipping commit."
          else
            git commit -m "docs: sync wiki from forge-sdd tag ${TAG_NAME}"
            git push origin "${BRANCH_NAME}"
            
            echo "Creating Pull Request on lp-forge-sdd..."
            GH_TOKEN="${WIKI_PAT}" gh pr create --repo nathanramorim/lp-forge-sdd \
              --base main \
              --head "${BRANCH_NAME}" \
              --title "docs: sync wiki from forge-sdd ${TAG_NAME}" \
              --body "Automated documentation sync from forge-sdd tag ${TAG_NAME}."
          fi
