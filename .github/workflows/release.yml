name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract Release Notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          CLEAN_TAG="${TAG_NAME#v}"
          VERSION_BASE=$(echo "${CLEAN_TAG}" | cut -d'-' -f1)
          
          echo "Extracting release notes for Version ${VERSION_BASE} from sdd/releases/history.md..."
          node -e '
            const fs = require("fs");
            const versionBase = process.argv[1];
            const content = fs.readFileSync("sdd/releases/history.md", "utf8");
            const regex = new RegExp(`###\\s+Versão\\s+${versionBase}[\\s\\S]*?(?=\\n###|\\n##|$)`, "i");
            const match = content.match(regex);
            let notes = "";
            if (match) {
              notes = match[0].trim();
            } else {
              notes = `Release notes para a versão ${process.env.GITHUB_REF_NAME}. Veja sdd/releases/history.md para detalhes.`;
            }
            fs.writeFileSync("/tmp/RELEASE_NOTES.md", notes + "\n");
          ' "${VERSION_BASE}"
          
          echo "Release notes written to /tmp/RELEASE_NOTES.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=/tmp/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Wiki to lp-forge-sdd
        env:
          WIKI_PAT: ${{ secrets.LP_FORGE_SDD_TOKEN }}
        run: |
          if [ -z "$WIKI_PAT" ]; then
            echo "Warning: LP_FORGE_SDD_TOKEN is not set. Skipping wiki sync."
            exit 0
          fi
          
          TAG_NAME="${GITHUB_REF_NAME}"
          BRANCH_NAME="docs/sync-${TAG_NAME}"
          
          echo "Cloning lp-forge-sdd..."
          git clone "https://x-access-token:${WIKI_PAT}@github.com/nathanramorim/lp-forge-sdd.git" lp-repo
          
          cd lp-repo
          git checkout -b "${BRANCH_NAME}"
          
          echo "Creating target subdirectories in pt-BR and en-US..."
          mkdir -p wiki/content/pt-BR/arquiteto wiki/content/pt-BR/engenheiro wiki/content/pt-BR/produto wiki/content/pt-BR/qa
          mkdir -p wiki/content/en-US/arquiteto wiki/content/en-US/engenheiro wiki/content/en-US/produto wiki/content/en-US/qa
          
          echo "Copying documentation to target locales..."
          # pt-BR
          cp ../docs/introducao.md wiki/content/pt-BR/
          cp ../docs/comandos.md wiki/content/pt-BR/engenheiro/comandos.md
          cp ../docs/skills.md wiki/content/pt-BR/engenheiro/skills.md
          cp ../docs/telemetria.md wiki/content/pt-BR/engenheiro/telemetria.md
          cp ../docs/arquitetura-e-fluxo-forge-sdd.md wiki/content/pt-BR/arquiteto/arquitetura.md
          cp ../sdd/releases/history.md wiki/content/pt-BR/releases.md
          
          # en-US
          cp ../docs/introducao.md wiki/content/en-US/
          cp ../docs/comandos.md wiki/content/en-US/engenheiro/comandos.md
          cp ../docs/skills.md wiki/content/en-US/engenheiro/skills.md
          cp ../docs/telemetria.md wiki/content/en-US/engenheiro/telemetria.md
          cp ../docs/arquitetura-e-fluxo-forge-sdd.md wiki/content/en-US/arquiteto/arquitetura.md
          cp ../sdd/releases/history.md wiki/content/en-US/releases.md
          
          echo "Updating structure JSONs..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const wikiDir = 'wiki';
            const ptPath = path.join(wikiDir, 'structure.pt-BR.json');
            const enPath = path.join(wikiDir, 'structure.en-US.json');

            function updateStruct(structPath, isPT) {
              if (!fs.existsSync(structPath)) {
                console.log('Struct path not found: ' + structPath);
                return;
              }
              const struct = JSON.parse(fs.readFileSync(structPath, 'utf8'));
              let updated = false;
              if (struct.sections) {
                const engSection = struct.sections.find(s => s.section_id === 'engenharia');
                if (engSection) {
                  engSection.pages = engSection.pages || [];
                  if (!engSection.pages.some(p => p.id === 'telemetria')) {
                    engSection.pages.push({
                      id: 'telemetria',
                      title: isPT ? 'Telemetria & Métricas' : 'Telemetry & Metrics',
                      file: 'engenheiro/telemetria.md'
                    });
                    updated = true;
                    console.log('Added telemetria page to ' + structPath);
                  }
                }
              }
              if (updated) {
                fs.writeFileSync(structPath, JSON.stringify(struct, null, 2) + '\n');
              }
            }

            updateStruct(ptPath, true);
            updateStruct(enPath, false);
          "
          
          echo "Configuring git user..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wiki/
          
          if git diff --staged --quiet; then
            echo "No changes in wiki, skipping commit."
          else
            git commit -m "docs: sync wiki from forge-sdd tag ${TAG_NAME}"
            git push origin "${BRANCH_NAME}" --force
            
            echo "Creating Pull Request on lp-forge-sdd via REST API..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${WIKI_PAT}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/nathanramorim/lp-forge-sdd/pulls \
              -d "{\"title\":\"docs: sync wiki from forge-sdd ${TAG_NAME}\",\"body\":\"Automated documentation sync from forge-sdd tag ${TAG_NAME}.\",\"head\":\"${BRANCH_NAME}\",\"base\":\"main\"}")
            
            if [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 422 ]; then
              echo "Pull Request created successfully or already exists (HTTP $RESPONSE)."
            else
              echo "Failed to create Pull Request (HTTP $RESPONSE)."
              exit 1
            fi
          fi
