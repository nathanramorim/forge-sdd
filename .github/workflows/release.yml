name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Wiki to lp-forge-sdd
        env:
          WIKI_PAT: ${{ secrets.LP_FORGE_SDD_TOKEN }}
        run: |
          if [ -z "$WIKI_PAT" ]; then
            echo "Warning: LP_FORGE_SDD_TOKEN is not set. Skipping wiki sync."
            exit 0
          fi
          
          echo "Cloning lp-forge-sdd..."
          git clone "https://x-access-token:${WIKI_PAT}@github.com/nathanramorim/lp-forge-sdd.git" lp-repo
          
          echo "Recreating wiki directory in target repo..."
          rm -rf lp-repo/wiki
          mkdir -p lp-repo/wiki
          
          echo "Copying documentation..."
          cp -r docs/* lp-repo/wiki/
          cp README.md lp-repo/wiki/HOME.md
          
          echo "Committing and pushing to lp-forge-sdd..."
          cd lp-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wiki/
          
          if git diff --staged --quiet; then
            echo "No changes in wiki, skipping commit."
          else
            git commit -m "docs: sync wiki from forge-sdd tag ${GITHUB_REF_NAME}"
            git push origin main
          fi
