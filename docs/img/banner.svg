    <path d="M22.5 13.4 L16 17 V23.8 L22.5 20.2 Z" fill="#b7bfce"/>
  </g>
  <text x="152" y="88" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#e9ecf4" letter-spacing="-0.5">forge-sdd</text>

  <!-- Eyebrow -->
  <circle cx="86" cy="140" r="5" fill="#3ecf8e"/>
  <text x="100" y="145" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#99a2b8" letter-spacing="1.4">FRAMEWORK OPEN SOURCE (MIT) · PIPELINE DE 3 SESSÕES</text>

  <!-- Título -->
  <text x="80" y="205" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#ffffff" letter-spacing="-1.2">Seu time de IA,</text>
  <text x="80" y="265" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="url(#acc)" letter-spacing="-1.2">com método.</text>

  <text x="80" y="305" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="19" fill="#99a2b8">Você decide numa sessão. Outras duas</text>
  <text x="80" y="331" font-family="Montserrat, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="19" fill="#99a2b8">constroem e revisam sozinhas.</text>

  <!-- Terminal -->
  <rect x="80" y="352" width="500" height="40" rx="12" fill="#090b10" stroke="#363e52" stroke-width="1.2"/>
  <text x="100" y="377" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" font-size="16" fill="#3ecf8e">$ npm i -g @nathanramorim/forge-sdd</text>

