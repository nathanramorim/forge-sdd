version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: forge-sdd
    main: ./cmd/forge-sdd
    binary: forge-sdd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: forge-sdd
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

brews:
  - name: forge-sdd
    repository:
      owner: nathanramorim
      name: homebrew-forge-sdd
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/nathanramorim/forge-sdd
    description: "CLI que scaffolda estruturas Forge-SDD em segundos"
    license: MIT
    install: |
      bin.install "forge-sdd"
    test: |
      system "#{bin}/forge-sdd", "version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
